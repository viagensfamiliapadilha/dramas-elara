<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramas da Elara</title>

<style>
body{
    background:#141414;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

header{
    background:black;
    color:#e50914;
    text-align:center;
    padding:20px;
    font-size:2rem;
    font-weight:bold;
}

.container{
    padding:20px;
}

.episodio{
    background:#222;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.episodio a{
    color:white;
    text-decoration:none;
    display:block;
}

.episodio:hover{
    background:#333;
}
</style>
</head>

<body>

<header>
🎬 Dramas da Elara
</header>

<div class="container" id="lista">
Carregando episódios...
</div>

<script>
fetch('catalogo.json')
.then(res => res.json())
.then(data => {

    const lista = document.getElementById('lista');

    lista.innerHTML = '';

    data.series[0].episodios.forEach(ep => {

        lista.innerHTML += `
        <div class="episodio">
            <a href="${ep.youtube}" target="_blank">
                📺 ${ep.titulo}
            </a>
        </div>
        `;

    });

});
</script>

</body>
</html>
